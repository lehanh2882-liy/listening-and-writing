<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening and Writing - Kho Tài Liệu</title>
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com"></script>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --accent-hover: #1d4ed8;
            --border-color: #e2e8f0;
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1rem;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 1.875rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-primary);
            margin-bottom: 0.4rem;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        /* Toolbar & Filter */
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .search-box {
            position: relative;
            flex: 1;
            min-width: 260px;
        }

        .search-box i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            width: 18px;
        }

        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem 0.75rem 2.75rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            font-family: inherit;
            background: var(--bg-card);
            transition: all 0.2s;
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .stats {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 500;
            background: var(--bg-card);
            padding: 0.6rem 1.1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        /* File List Card */
        .file-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-md);
            overflow: hidden;
        }

        .file-list {
            list-style: none;
            max-height: 650px;
            overflow-y: auto;
        }

        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            transition: background 0.15s;
            gap: 1rem;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: var(--bg-hover);
        }

        .file-info {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            min-width: 0;
            flex: 1;
        }

        .file-icon {
            color: var(--accent);
            flex-shrink: 0;
        }

        .file-path {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.875rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
        }

        .file-path:hover {
            color: var(--accent);
            text-decoration: underline;
        }

        .file-meta {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            flex-shrink: 0;
        }

        .file-size {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-family: 'JetBrains Mono', monospace;
            margin-right: 0.25rem;
        }

        .btn-action {
            background: transparent;
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
        }

        .btn-action:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .btn-open {
            background: #eff6ff;
            color: var(--accent);
            border-color: #bfdbfe;
        }

        .state-box {
            padding: 4rem 2rem;
            text-align: center;
            color: var(--text-secondary);
        }

        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #fecaca;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        /* Modal Preview */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(2px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 50;
        }

        .modal {
            background: var(--bg-card);
            width: 100%;
            max-width: 850px;
            max-height: 85vh;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.95rem;
            font-weight: 600;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0.25rem;
        }

        .modal-body {
            padding: 1.5rem;
            overflow: auto;
            background: #0f172a;
            color: #e2e8f0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Listening and Writing</h1>
        <p>Danh sách toàn bộ tệp tin và tài liệu trong kho lưu trữ</p>
    </header>

    <div class="error-msg" id="errorBox"></div>

    <div class="toolbar">
        <div class="search-box">
            <i data-lucide="search"></i>
            <input type="text" id="searchInput" placeholder="Tìm kiếm nhanh tên bài, thư mục hoặc định dạng file..." oninput="filterFiles()">
        </div>
        <div class="stats" id="statsBadge">Đang tải...</div>
    </div>

    <div class="file-card">
        <ul class="file-list" id="fileList">
            <li class="state-box">Đang đồng bộ danh sách tệp từ GitHub...</li>
        </ul>
    </div>
</div>

<!-- Modal xem nhanh nội dung -->
<div class="modal-backdrop" id="previewModal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span class="modal-title" id="modalTitle">filename</span>
            <button class="modal-close" onclick="closeModal()"><i data-lucide="x"></i></button>
        </div>
        <pre class="modal-body" id="modalContent">Đang tải nội dung...</pre>
    </div>
</div>

<script>
    lucide.createIcons();

    // Cấu hình cố định theo tài khoản GitHub của bạn
    const CONFIG = {
        owner: 'lehanh2882-liy',
        repo: 'listening-and-writing',
        branch: 'main'
    };

    let allFiles = [];

    function formatBytes(bytes) {
        if (!bytes) return '—';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function fetchRepoFiles() {
        const errorBox = document.getElementById('errorBox');
        const fileList = document.getElementById('fileList');

        try {
            const apiUrl = `https://github.com{CONFIG.owner}/${CONFIG.repo}/git/trees/${CONFIG.branch}?recursive=1`;
            const response = await fetch(apiUrl);
