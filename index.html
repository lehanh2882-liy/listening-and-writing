<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening and Writing</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card: #ffffff;
            --hover: #f1f5f9;
            --text: #0f172a;
            --sub: #64748b;
            --accent: #2563eb;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 2.5rem 1rem;
            line-height: 1.5;
        }
        .container { max-width: 920px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.8rem; font-weight: 700; margin-bottom: 0.25rem; }
        header p { color: var(--sub); font-size: 0.95rem; }

        .toolbar { display: flex; gap: 0.75rem; margin-bottom: 1rem; flex-wrap: wrap; }
        .search {
            flex: 1; min-width: 240px; padding: 0.75rem 1rem;
            border: 1px solid var(--border); border-radius: 10px;
            font-size: 0.95rem; background: var(--card); outline: none;
        }
        .search:focus { border-color: var(--accent); }
        .badge {
            background: var(--card); border: 1px solid var(--border);
            padding: 0.75rem 1.1rem; border-radius: 10px;
            font-size: 0.875rem; font-weight: 600; color: var(--sub);
        }

        .card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        .list { list-style: none; }
        .item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.95rem 1.25rem; border-bottom: 1px solid var(--border); gap: 1rem;
        }
        .item:last-child { border-bottom: none; }
        .item:hover { background: var(--hover); }
        .info { display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex: 1; }
        .name {
            font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
            font-size: 0.9rem; color: var(--text); text-decoration: none;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .name:hover { color: var(--accent); text-decoration: underline; }
        .actions { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .btn {
            padding: 0.4rem 0.85rem; border-radius: 6px; font-size: 0.82rem;
            font-weight: 500; cursor: pointer; text-decoration: none;
            border: 1px solid #bfdbfe; background: #eff6ff; color: var(--accent);
        }
        .btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-gh {
            border-color: var(--border); background: #fff; color: var(--text);
        }
        .btn-gh:hover { background: #334155; color: #fff; border-color: #334155; }
        .empty { padding: 3rem 1rem; text-align: center; color: var(--sub); }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Listening and Writing</h1>
        <p>Danh sách toàn bộ tài liệu và bài học</p>
    </header>

    <div class="toolbar">
        <input type="text" class="search" id="search" placeholder="Tìm kiếm tên bài học hoặc file..." oninput="render()">
        <div class="badge" id="count">0 tệp</div>
    </div>

    <div class="card">
        <ul class="list" id="list"></ul>
    </div>
</div>

<script>
    // Danh sách tệp trong kho lưu trữ lehanh2882-liy/listening-and-writing
    // Khi thêm file mới lên GitHub, bạn chỉ cần thêm tên file vào danh sách dưới đây:
    const FILES = [
        "README.md",
        "listening.html",
        "writing.html"
    ];

    const USER = "lehanh2882-liy";
    const REPO = "listening-and-writing";

    function render() {
        const q = document.getElementById('search').value.toLowerCase().trim();
        const filtered = FILES.filter(f => f.toLowerCase().includes(q));
        document.getElementById('count').textContent = `${filtered.length} tệp`;

        if (!filtered.length) {
            document.getElementById('list').innerHTML = '<li class="empty">Không tìm thấy tệp phù hợp.</li>';
            return;
        }

        document.getElementById('list').innerHTML = filtered.map(path => {
            const isHtml = path.toLowerCase().endsWith('.html');
            const pageUrl = `./${path}`;
            const githubUrl = `https://github.com{USER}/${REPO}/blob/main/${path}`;
            return `
                <li class="item">
                    <div class="info">
                        <span>${isHtml ? '🌐' : '📄'}</span>
                        <a href="${isHtml ? pageUrl : githubUrl}" target="_blank" class="name">${path}</a>
                    </div>
                    <div class="actions">
                        ${isHtml ? `<a href="${pageUrl}" target="_blank" class="btn">Mở bài</a>` : ''}
                        <a href="${githubUrl}" target="_blank" class="btn btn-gh">GitHub</a>
                    </div>
                </li>
            `;
        }).join('');
    }

    render();
</script>
</body>
</html>
