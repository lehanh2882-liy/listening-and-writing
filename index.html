<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listening and Writing - Kho Tài Liệu</title>
    <style>
        :root {
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-hover: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --accent: #2563eb;
            --border-color: #e2e8f0;
            --radius: 12px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 2.5rem 1rem;
        }
        .container { max-width: 960px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 1.85rem; font-weight: 700; margin-bottom: 0.3rem; }
        header p { color: var(--text-secondary); font-size: 0.95rem; }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.25rem;
            flex-wrap: wrap;
        }
        .search-box { flex: 1; min-width: 250px; }
        .search-box input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1px solid var(--border-color);
            border-radius: 10px;
            font-size: 0.95rem;
            background: var(--bg-card);
        }
        .search-box input:focus { outline: none; border-color: var(--accent); }
        .stats {
            font-size: 0.875rem;
            color: var(--text-secondary);
            font-weight: 600;
            background: var(--bg-card);
            padding: 0.65rem 1.1rem;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .file-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }
        .file-list { list-style: none; max-height: 650px; overflow-y: auto; }
        .file-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.9rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            gap: 1rem;
        }
        .file-item:last-child { border-bottom: none; }
        .file-item:hover { background-color: var(--bg-hover); }
        .file-info { display: flex; align-items: center; gap: 0.75rem; min-width: 0; flex: 1; }
        .file-path {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 0.88rem;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            text-decoration: none;
        }
        .file-path:hover { color: var(--accent); text-decoration: underline; }
        .file-meta { display: flex; align-items: center; gap: 0.65rem; flex-shrink: 0; }
        .file-size { font-size: 0.8rem; color: var(--text-secondary); font-family: monospace; }

        .btn-action {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 0.35rem 0.75rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            color: var(--text-primary);
            cursor: pointer;
            text-decoration: none;
        }
        .btn-action:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-open { background: #eff6ff; color: var(--accent); border-color: #bfdbfe; }

        .state-box { padding: 3.5rem 1.5rem; text-align: center; color: var(--text-secondary); }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 1rem 1.25rem;
            border-radius: 10px;
            border: 1px solid #fecaca;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            display: none;
        }

        .modal-backdrop {
            position: fixed; inset: 0;
            background: rgba(15, 23, 42, 0.5);
            display: none; align-items: center; justify-content: center;
            padding: 1.5rem; z-index: 50;
        }
        .modal {
            background: #fff; width: 100%; max-width: 850px; max-height: 85vh;
            border-radius: var(--radius); display: flex; flex-direction: column; overflow: hidden;
        }
        .modal-header {
            padding: 1rem 1.5rem; border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center; font-weight: 600;
        }
        .modal-close { background: none; border: none; font-size: 1.25rem; cursor: pointer; color: var(--text-secondary); }
        .modal-body {
            padding: 1.5rem; overflow: auto; background: #0f172a; color: #e2e8f0;
            font-family: monospace; font-size: 0.85rem; white-space: pre-wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Listening and Writing</h1>
        <p>Danh sách toàn bộ tệp tin và tài liệu trong kho lưu trữ</p>
    </header>

    <div class="error-msg" id="errorBox"></div>

    <div class="toolbar">
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm nhanh tên bài, thư mục hoặc định dạng file..." oninput="filterFiles()">
        </div>
        <div class="stats" id="statsBadge">Đang tải...</div>
    </div>

    <div class="file-card">
        <ul class="file-list" id="fileList">
            <li class="state-box">Đang đồng bộ danh sách tệp từ GitHub...</li>
        </ul>
    </div>
</div>

<div class="modal-backdrop" id="previewModal" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalTitle">filename</span>
            <button class="modal-close" onclick="closeModal()">✕</button>
        </div>
        <pre class="modal-body" id="modalContent">Đang tải nội dung...</pre>
    </div>
</div>

<script>
    const OWNER = 'lehanh2882-liy';
    const REPO = 'listening-and-writing';
    let activeBranch = 'main';
    let allFiles = [];

    function formatBytes(bytes) {
        if (!bytes) return '—';
        const k = 1024;
        const sizes = ['B', 'KB', 'MB', 'GB'];
        const i = Math.floor(Math.log(bytes) / Math.log(k));
        return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    async function fetchRepoFiles() {
        const errorBox = document.getElementById('errorBox');
        const fileList = document.getElementById('fileList');
        const statsBadge = document.getElementById('statsBadge');

        try {
            // Thử nhánh main trước, nếu lỗi thử tiếp nhánh master
            let response = await fetch(`https://github.com{OWNER}/${REPO}/git/trees/main?recursive=1`);
            if (!response.ok) {
                activeBranch = 'master';
                response = await fetch(`https://github.com{OWNER}/${REPO}/git/trees/master?recursive=1`);
            }

            if (!response.ok) {
                if (response.status === 404) {
                    throw new Error('Lỗi 404: Không tìm thấy dữ liệu. Hãy đảm bảo kho lưu trữ "listening-and-writing" đang bật chế độ Public (Công khai) và đã có ít nhất 1 file.');
                }
                if (response.status === 403) {
                    throw new Error('Lỗi 403: Đã vượt quá giới hạn lượt tải miễn phí của GitHub (60 lần/giờ). Hãy đợi vài phút rồi tải lại trang.');
                }
                throw new Error(`Lỗi kết nối từ GitHub (Mã lỗi: ${response.status})`);
            }

            const data = await response.json();
            allFiles = (data.tree || []).filter(item => item.type === 'blob' && item.path !== 'index.html');
            renderFiles(allFiles);
        } catch (err) {
            errorBox.textContent = err.message;
            errorBox.style.display = 'block';
            fileList.innerHTML = '<li class="state-box">Không thể tải danh sách tệp.</li>';
            statsBadge.textContent = 'Lỗi tải dữ liệu';
        }
    }

    function renderFiles(files) {
        const fileList = document.getElementById('fileList');
        const statsBadge = document.getElementById('statsBadge');
        
        statsBadge.textContent = `${files.length} tệp tin`;

        if (files.length === 0) {
            fileList.innerHTML = '<li class="state-box">Chưa có tệp tin nào khác ngoài index.html.</li>';
            return;
        }

        fileList.innerHTML = files.map(file => {
            const githubUrl = `https://github.com{OWNER}/${REPO}/blob/${activeBranch}/${file.path}`;
            const pageUrl = `./${file.path}`;
            const isHtml = file.path.toLowerCase().endsWith('.html');

            return `
                <li class="file-item">
                    <div class="file-info">
                        <span>${isHtml ? '🌐' : '📄'}</span>
                        <a href="${isHtml ? pageUrl : githubUrl}" target="_blank" class="file-path" title="${file.path}">${file.path}</a>
                    </div>
                    <div class="file-meta">
                        <span class="file-size">${formatBytes(file.size)}</span>
                        ${isHtml ? `<a href="${pageUrl}" target="_blank" class="btn-action btn-open">Mở trang</a>` : ''}
                        <button class="btn-action" onclick="previewFile('${file.path}')">Xem nội dung</button>
                    </div>
                </li>
            `;
        }).join('');
    }
